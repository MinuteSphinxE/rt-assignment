[package]
name = "rtxon-rt"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "30"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.37"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
pollster = "0.4"
png = "0.18"
env_logger = "0.11"
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
[profile.release]
opt-level = 'z'     
lto = "fat"          
codegen-units = 1   
strip = true        
panic = 'abort'
